name = "robson-cassiano-cron-publisher"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[triggers]
# 1. Diariamente às 15:00 UTC (12:00 BRT): Disparo da Sequência de E-mails de 7 Dias
# 2. Segunda-feira às 15:00 UTC: Artigo da Live mais recente
# 3. Sexta-feira às 15:00 UTC: Artigo de Conteúdo Aleatório do acervo
crons = [
  "0 15 * * *",
  "0 15 * * 1",
  "0 15 * * 5"
]

[ai]
binding = "AI"

# Cloudflare D1 Database
[[d1_databases]]
binding = "DB"
database_name = "robson-cassiano-portfolio-db"
database_id = "0bfffdf2-cba9-4abb-90e4-72325fb1b640"

# Cloudflare Email Routing Binding
[[send_email]]
name = "EMAIL"

# Service Binding para o Email Router
[[services]]
binding = "EMAIL_ROUTER"
service = "robson-cassiano-email-router"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
