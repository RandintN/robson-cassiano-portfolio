name = "robson-cassiano-cron-publisher"
main = "src/index.ts"
compatibility_date = "2026-03-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 12 * * 1"] # Toda segunda-feira às 12:00 UTC (09:00 Horário de Brasília)

# As variáveis secretas são configuradas com:
# wrangler secret put YOUTUBE_CLIENT_ID
# wrangler secret put YOUTUBE_CLIENT_SECRET
# wrangler secret put YOUTUBE_REFRESH_TOKEN
# wrangler secret put GITHUB_TOKEN
# wrangler secret put GEMINI_API_KEY
